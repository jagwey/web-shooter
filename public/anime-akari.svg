<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="akariGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#701a75" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#130f1e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pinkHair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="45%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="pinkHairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="skinAkari" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f2"/>
      <stop offset="100%" stop-color="#ffe0d4"/>
    </linearGradient>
    <linearGradient id="rubyEyes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="pinkNeon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Neon Spider Web & Sakura Aura -->
  <circle cx="160" cy="155" r="145" fill="url(#akariGlow)"/>
  <g stroke="#f472b6" stroke-width="1.2" opacity="0.32" filter="url(#pinkNeon)">
    <circle cx="160" cy="155" r="118"/>
    <circle cx="160" cy="155" r="88"/>
    <line x1="42" y1="155" x2="278" y2="155"/>
    <line x1="160" y1="37" x2="160" y2="273"/>
    <line x1="76" y1="71" x2="244" y2="239"/>
    <line x1="244" y1="71" x2="76" y2="239"/>
  </g>

  <!-- Flowing Twin-Tails (Back Layer) -->
  <path d="M98 92 C52 105 32 168 38 258 C54 235 72 195 82 152 Z" fill="url(#pinkHairDark)"/>
  <path d="M222 92 C268 105 288 168 282 258 C266 235 248 195 238 152 Z" fill="url(#pinkHairDark)"/>
  <path d="M104 86 C64 98 46 155 48 242 C66 218 82 182 92 142 Z" fill="url(#pinkHair)"/>
  <path d="M216 86 C256 98 274 155 272 242 C254 218 238 182 228 142 Z" fill="url(#pinkHair)"/>

  <!-- Cyber-Kunoichi Techwear Jacket -->
  <path d="M58 310 C66 248 98 218 160 218 C222 218 254 248 262 310 Z" fill="#18122b" stroke="#f472b6" stroke-width="2"/>
  <path d="M118 220 L160 268 L202 220 L188 205 L160 238 L132 205 Z" fill="#ec4899" opacity="0.85"/>
  <!-- Choker & Neck -->
  <path d="M144 184 L144 218 L176 218 L176 184 Z" fill="url(#skinAkari)"/>
  <rect x="142" y="198" width="36" height="6" rx="3" fill="#1e1b4b" stroke="#f472b6" stroke-width="1.2"/>
  <circle cx="160" cy="201" r="3" fill="#38bdf8"/>

  <!-- Anime Face (Expressive Kunoichi) -->
  <path d="M116 114 C116 150 130 176 160 190 C190 176 204 150 204 114 C204 82 186 68 160 68 C134 68 116 82 116 114 Z" fill="url(#skinAkari)" stroke="#f3c6b6" stroke-width="1.2"/>

  <!-- Anime Blush -->
  <ellipse cx="130" cy="148" rx="9" ry="4" fill="#fb7185" opacity="0.45"/>
  <ellipse cx="190" cy="148" rx="9" ry="4" fill="#fb7185" opacity="0.45"/>

  <!-- Big Expressive Anime Eyes (Ruby / Magenta with Star Catchlights) -->
  <!-- Left Eye -->
  <path d="M123 127 Q136 117 150 128" stroke="#4c0519" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="137" cy="135" rx="9.5" ry="10.5" fill="url(#rubyEyes)"/>
  <ellipse cx="137" cy="136" rx="4.5" ry="5.5" fill="#4c0519"/>
  <circle cx="133.5" cy="130.5" r="3.2" fill="#ffffff"/>
  <circle cx="141" cy="139.5" r="1.6" fill="#ffffff"/>
  <!-- Right Eye -->
  <path d="M170 128 Q184 117 197 127" stroke="#4c0519" stroke-width="3.2" stroke-linecap="round"/>
  <ellipse cx="183" cy="135" rx="9.5" ry="10.5" fill="url(#rubyEyes)"/>
  <ellipse cx="183" cy="136" rx="4.5" ry="5.5" fill="#4c0519"/>
  <circle cx="179.5" cy="130.5" r="3.2" fill="#ffffff"/>
  <circle cx="187" cy="139.5" r="1.6" fill="#ffffff"/>

  <!-- Brows, Nose & Cheerful Anime Smile -->
  <path d="M124 115 Q137 110 148 115" stroke="#be185d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M172 115 Q183 110 196 115" stroke="#be185d" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M159 146 L158 152 L161 153" stroke="#d99b88" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M150 164 Q160 174 170 164" stroke="#be123c" stroke-width="2.2" fill="#fda4af" stroke-linecap="round"/>

  <!-- Hair Crown & Hime Bangs -->
  <path d="M106 135 C102 82 126 52 160 52 C194 52 218 82 214 135 L202 152 L198 106 L186 130 L176 96 L160 132 L144 96 L134 130 L122 106 L118 152 Z" fill="url(#pinkHair)" stroke="#9d174d" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Glossy Anime Hair HighlightHalo -->
  <path d="M124 84 Q160 72 196 84" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.65" stroke-dasharray="14 8"/>

  <!-- Cyber Hair Clips -->
  <polygon points="94,88 112,76 108,96" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" filter="url(#pinkNeon)"/>
  <polygon points="226,88 208,76 212,96" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2" filter="url(#pinkNeon)"/>

  <!-- Neon Pink Energy Web Threads in Foreground -->
  <g stroke="#f472b6" stroke-width="2" filter="url(#pinkNeon)">
    <path d="M40 275 Q115 235 205 268"/>
    <path d="M72 295 Q160 225 275 245" stroke="#38bdf8"/>
  </g>
</svg>
