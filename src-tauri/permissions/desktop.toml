[[permission]]
identifier = "desktop-commands"
description = "Overlay, Win32 window play, settings, and camera status"
commands.allow = [
  "get_settings",
  "save_settings",
  "desktop_snapshot",
  "toggle_overlay",
  "place_overlay",
  "hide_overlay_cmd",
  "show_control_cmd",
  "win32_status",
  "list_windows",
  "window_at",
  "window_client",
  "move_window",
  "place_window",
  "nudge_window",
  "fling_window",
  "cancel_fling",
  "camera_holders",
  "close_window",
  "close_active_tab",
  "minimize_window",
  "get_foreground_window",
]
